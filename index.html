<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de usuarios</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="contenedorPrincipal">
        <h1 id = "buscador">Buscador de usuarios</h1>

        <label for = "ingresaID">Ingresa el ID: </label>
        <input
            type="text"
            id="ingresaID"
            placeholder="ID">
        <button id = "botonBuscarID">
            Buscar
        </button>
        
        <button id = "botonLimpiar">
            Limpiar
        </button>

        <div id = "mostrarDatosUsuario">
            Información del usuario
        </div>

        <p id="mensajeError"></p>

    </div>
    
</body>
</html>
